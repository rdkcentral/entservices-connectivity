name: Coverity Full Analysis Scan

on:
  push:
    branches: [ develop, main ]
    paths: ['**/*.c', '**/*.cpp', '**/*.cc', '**/*.cxx', '**/*.h', '**/*.hpp']

permissions:
   contents: read    

jobs:
  call_coverity_full_scan:
    uses: rdk-e/rdkservices-cpc/.github/workflows/coverity_component_full_scan.yml@develop
    with:
      branchName: develop
      # Specify your actual build command here
      buildCommand: |
        bash build_dependencies.sh
        bash cov_build.sh
      customSetup: |
        apt-get update -y
        apt-get install -y libsqlite3-dev libcurl4-openssl-dev valgrind lcov clang libsystemd-dev libboost-all-dev libwebsocketpp-dev meson libcunit1 libcunit1-dev curl protobuf-compiler-grpc libgrpc-dev libgrpc++-dev libjsoncpp-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        pip install jsonref
    secrets: 
      RDKE_GITHUB_TOKEN: ${{ secrets.RDKE_GITHUB_TOKEN }}
      RDKE_ARTIFACTORY_USER_APIKEY: ${{ secrets.RDKE_ARTIFACTORY_USER_APIKEY }}
      RDKE_COVERITY_APIKEY: ${{ secrets.RDKE_COVERITY_APIKEY }}
      RDKE_GITHUB_TOKENCM: ${{ secrets.RDKCM_RDKE }}
